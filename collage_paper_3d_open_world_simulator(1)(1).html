<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>九龍紙戯・霧の人面森 — Collage Paper 3D Open-World Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --ink: #1a1617;
      --paper: #ded6c7;
      --paper-dark: #b8aea0;
      --rose: #b87e82;
      --crimson: #8f2228;
      --moss: #5a6e52;
      --amber: #d99543;
      --panel-bg: rgba(27, 23, 25, 0.86);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4e4850;
      color: var(--paper);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }

    /* Gritty Magazine / Analog Film Grain & Halftone Overlay */
    #zine-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0.44;
      background-image:
        radial-gradient(rgba(30, 22, 26, 0) 42%, rgba(14, 10, 12, 0.78) 100%),
        radial-gradient(rgba(255, 248, 235, 0.08) 1px, transparent 1px),
        repeating-linear-gradient(
          0deg,
          rgba(20, 14, 16, 0.06) 0px,
          rgba(20, 14, 16, 0.06) 1px,
          transparent 1px,
          transparent 3px
        );
      background-size: 100% 100%, 4px 4px, 100% 4px;
      mix-blend-mode: multiply;
      transition: opacity 0.3s ease;
    }
    #zine-overlay.off {
      opacity: 0;
    }

    #grain-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 7;
      opacity: 0.16;
      mix-blend-mode: overlay;
    }
    #grain-canvas.off {
      opacity: 0;
    }

    /* Torn magazine clipping box */
    .paper-box {
      background: var(--panel-bg);
      border: 2px solid var(--paper);
      box-shadow: 4px 4px 0px rgba(18, 13, 15, 0.9), 0 0 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
    }

    .ink-btn {
      background: #231d1f;
      color: var(--paper);
      border: 1.5px solid var(--paper);
      box-shadow: 2px 2px 0px var(--ink);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .ink-btn:hover {
      background: var(--crimson);
      color: #f7f1e6;
      transform: translate(-1px, -1px);
    }
    .ink-btn:active {
      transform: translate(1px, 1px);
    }
    .ink-btn.active {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--ink);
      box-shadow: 2px 2px 0px var(--crimson);
    }

    /* Top HUD */
    #hud-top {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
      z-index: 20;
    }
    #hud-top > * {
      pointer-events: auto;
    }

    #zone-card {
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 295px;
    }
    .stamp-title {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--rose);
      font-family: "Courier New", monospace;
      text-transform: uppercase;
    }
    #zone-name {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--paper);
      text-shadow: 2px 2px 0 rgba(18, 12, 14, 0.9);
    }
    #zone-sub {
      font-size: 11px;
      color: var(--paper-dark);
    }
    #talisman-row {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--amber);
    }
    .talisman-pips {
      display: flex;
      gap: 4px;
    }
    .talisman-pip {
      width: 11px;
      height: 15px;
      border: 1.5px solid var(--amber);
      background: rgba(217, 149, 67, 0.14);
      display: inline-block;
      transition: all 0.25s ease;
    }
    .talisman-pip.lit {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      transform: rotate(-5deg) scale(1.1);
    }

    #top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    /* Simulator Drawer */
    #sim-drawer {
      position: fixed;
      top: 58px;
      right: 12px;
      width: 276px;
      max-height: calc(100vh - 86px);
      overflow-y: auto;
      padding: 12px;
      z-index: 25;
      display: none;
      flex-direction: column;
      gap: 11px;
    }
    #sim-drawer.open {
      display: flex;
    }
    .drawer-section {
      border-top: 1px dashed rgba(222, 214, 199, 0.3);
      padding-top: 8px;
    }
    .drawer-section:first-child {
      border-top: none;
      padding-top: 0;
    }
    .drawer-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--rose);
      margin-bottom: 6px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .btn-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .btn-grid .ink-btn, .btn-grid-3 .ink-btn {
      padding: 6px 4px;
      font-size: 11px;
      text-align: center;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--rose);
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .toggle-row input {
      accent-color: var(--amber);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Minimap */
    #minimap-wrap {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 20;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    #minimap {
      width: 132px;
      height: 132px;
      display: block;
      background: #221d1f;
      border: 1px solid rgba(222, 214, 199, 0.38);
    }
    .minimap-caption {
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--paper-dark);
    }

    /* Interaction Prompt */
    #interact-prompt {
      position: fixed;
      bottom: 122px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      z-index: 22;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: var(--paper);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      box-shadow: 4px 4px 0px var(--crimson);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    #interact-prompt.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }
    .key-badge {
      display: inline-block;
      background: var(--crimson);
      color: #fff;
      padding: 1px 6px;
      margin-right: 6px;
      font-family: "Courier New", monospace;
      font-size: 12px;
    }

    /* Torn Magazine Dialogue Modal */
    #dialogue-box {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(620px, calc(100vw - 28px));
      z-index: 30;
      padding: 14px 16px;
      display: none;
      gap: 14px;
      align-items: center;
      background: #dfd6c5;
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0px rgba(20, 14, 16, 0.9), -3px -3px 0px var(--rose);
    }
    #dialogue-box.open {
      display: flex;
    }
    #dialogue-portrait {
      width: 88px;
      height: 108px;
      flex-shrink: 0;
      border: 2px solid var(--ink);
      background: #5c545b;
      object-fit: contain;
      padding: 3px;
      box-shadow: 3px 3px 0 var(--ink);
    }
    #dialogue-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    #dialogue-name {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--crimson);
      border-bottom: 1.5px solid var(--ink);
      padding-bottom: 3px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    #dialogue-role {
      font-size: 11px;
      color: #4a4042;
      font-weight: 700;
    }
    #dialogue-text {
      font-size: 14px;
      line-height: 1.6;
      font-weight: 600;
      min-height: 44px;
    }
    #dialogue-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Zone Toast */
    #zone-toast {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 24;
      padding: 8px 22px;
      background: rgba(24, 20, 22, 0.92);
      border: 1.5px solid var(--paper);
      box-shadow: 4px 4px 0 var(--crimson);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.22em;
      color: var(--paper);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #zone-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Controls Hint */
    #controls-hint {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 20;
      padding: 7px 11px;
      font-size: 11px;
      line-height: 1.5;
      color: var(--paper-dark);
      max-width: 248px;
    }
    #controls-hint b {
      color: var(--amber);
      font-family: "Courier New", monospace;
    }

    /* Touch Controls */
    #touch-controls {
      position: fixed;
      bottom: 16px;
      right: 14px;
      left: 14px;
      z-index: 23;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }
    #touch-controls.visible {
      display: flex;
    }
    #touch-controls > * {
      pointer-events: auto;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 4px;
    }
    .touch-btn {
      background: rgba(26, 21, 23, 0.86);
      border: 1.5px solid var(--paper);
      color: var(--paper);
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 var(--ink);
      touch-action: none;
    }
    .touch-btn:active {
      background: var(--crimson);
    }
    .action-pad {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-pad .touch-btn {
      width: 66px;
      height: 46px;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    /* Opening Splash Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(66, 58, 66, 0.72), rgba(16, 13, 15, 0.94));
      padding: 20px;
      transition: opacity 0.45s ease;
    }
    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .splash-card {
      max-width: 520px;
      width: 100%;
      padding: 26px 28px;
      background: #dfd6c6;
      color: var(--ink);
      border: 3px solid var(--ink);
      box-shadow: 9px 9px 0 rgba(16, 12, 14, 0.92), -4px -4px 0 var(--rose);
      text-align: center;
    }
    .splash-kicker {
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.24em;
      color: var(--crimson);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .splash-title {
      font-size: clamp(26px, 5.5vw, 38px);
      font-weight: 900;
      letter-spacing: 0.16em;
      margin: 0 0 10px;
      line-height: 1.15;
    }
    .splash-sub {
      font-size: 13px;
      line-height: 1.7;
      color: #362f31;
      margin: 0 0 18px;
    }
    .splash-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 20px;
    }
    .splash-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border: 1.5px solid var(--ink);
      background: #cfc3b0;
    }
    #start-btn {
      font-size: 15px;
      padding: 12px 30px;
      background: var(--crimson);
      color: #f7f1e6;
      border: 2.5px solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      font-family: inherit;
      font-weight: 900;
      letter-spacing: 0.18em;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    #start-btn:hover {
      background: var(--ink);
      color: var(--paper);
      transform: translate(-2px, -2px);
    }

    @media (max-width: 720px) {
      #controls-hint { display: none; }
      #minimap-wrap { bottom: 168px; left: 10px; }
      #minimap { width: 96px; height: 96px; }
      #zone-card { max-width: 195px; padding: 6px 10px; }
      #zone-name { font-size: 14px; }
      #interact-prompt { bottom: 174px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="zine-overlay"></div>
  <canvas id="grain-canvas" width="256" height="256"></canvas>

  <!-- Top HUD -->
  <div id="hud-top">
    <div id="zone-card" class="paper-box">
      <div class="stamp-title">MAGAZINE COLLAGE 3D WORLD</div>
      <div id="zone-name">人面並木道</div>
      <div id="zone-sub">霧に沈む磁器人形の切り抜き回廊</div>
      <div id="talisman-row">
        <span>切抜札</span>
        <div class="talisman-pips" id="talisman-pips">
          <span class="talisman-pip"></span>
          <span class="talisman-pip"></span>
          <span class="talisman-pip"></span>
          <span class="talisman-pip"></span>
          <span class="talisman-pip"></span>
        </div>
        <span id="talisman-count">0/5</span>
      </div>
    </div>

    <div id="top-controls">
      <button class="ink-btn" id="btn-sound" title="サウンド切替 (M)">音: ON</button>
      <button class="ink-btn" id="btn-cam" title="視点切替 (V)">視点: 3人称</button>
      <button class="ink-btn" id="btn-shout" title="囁き・喝 (R)">囁く (R)</button>
      <button class="ink-btn" id="btn-touch" title="タッチ操作表示">パッド</button>
      <button class="ink-btn" id="btn-drawer" title="世界設定パネル">世界設定</button>
    </div>
  </div>

  <!-- Zone Banner Toast -->
  <div id="zone-toast">人面並木道</div>

  <!-- Simulator Drawer -->
  <div id="sim-drawer" class="paper-box">
    <div class="drawer-section">
      <div class="drawer-label"><span>霧・紙質プリセット</span></div>
      <div class="btn-grid-3">
        <button class="ink-btn active" data-atmo="mist">霧の古森</button>
        <button class="ink-btn" data-atmo="crimson">九龍紅霧</button>
        <button class="ink-btn" data-atmo="newsprint">古雑誌紙</button>
      </div>
    </div>

    <div class="drawer-section">
      <div class="drawer-label"><span>平面カットアウト表現</span></div>
      <div class="btn-grid">
        <button class="ink-btn active" data-paper="flat3d">3D紙板(極薄)</button>
        <button class="ink-btn" data-paper="billboard">看板ビルボード</button>
      </div>
    </div>

    <div class="drawer-section">
      <div class="drawer-label">
        <span>紙の揺らぎ / 蠢き</span>
        <span id="wobble-val">1.0x</span>
      </div>
      <input type="range" id="slider-wobble" min="0" max="2" step="0.1" value="1" />
    </div>

    <div class="drawer-section">
      <div class="drawer-label"><span>ざらざら印刷エフェクト</span></div>
      <label class="toggle-row">
        <span>網点・フィルム粒子</span>
        <input type="checkbox" id="chk-zine" checked />
      </label>
      <label class="toggle-row">
        <span>霧の胞子・紙片パーティクル</span>
        <input type="checkbox" id="chk-rain" checked />
      </label>
    </div>

    <div class="drawer-section">
      <div class="drawer-label"><span>区画ワープ (FAST TRAVEL)</span></div>
      <div class="btn-grid">
        <button class="ink-btn" data-warp="avenue">人面並木道</button>
        <button class="ink-btn" data-warp="swamp">人面根の沼</button>
        <button class="ink-btn" data-warp="thicket">白芋虫の茂み</button>
        <button class="ink-btn" data-warp="shrine">灯火の切り株</button>
      </div>
    </div>
  </div>

  <!-- Minimap -->
  <div id="minimap-wrap" class="paper-box">
    <canvas id="minimap" width="132" height="132"></canvas>
    <div class="minimap-caption">古紙の探索図</div>
  </div>

  <!-- Interaction Prompt -->
  <div id="interact-prompt"><span class="key-badge">F</span><span id="interact-label">覗き込む</span></div>

  <!-- Torn Magazine Dialogue Modal -->
  <div id="dialogue-box">
    <img id="dialogue-portrait" alt="portrait" src="" />
    <div id="dialogue-content">
      <div id="dialogue-name">
        <span id="dlg-speaker">人面樹</span>
        <span id="dialogue-role">霧の監視者</span>
      </div>
      <div id="dialogue-text">……</div>
      <div id="dialogue-actions">
        <button class="ink-btn" id="dlg-next">次へ / 閉じる (F)</button>
      </div>
    </div>
  </div>

  <!-- Controls Hint -->
  <div id="controls-hint" class="paper-box">
    <b>WASD / 矢印</b> 移動 &amp; 紙フリップ<br />
    <b>ドラッグ / Q・E</b> カメラ回転<br />
    <b>SPACE</b> 紙ヒラヒラ跳躍 / <b>R</b> 囁き<br />
    <b>F</b> 異形を覗く・切抜札を集める
  </div>

  <!-- Touch Controls -->
  <div id="touch-controls">
    <div class="dpad">
      <div></div>
      <button class="touch-btn" data-key="up">▲</button>
      <div></div>
      <button class="touch-btn" data-key="left">◀</button>
      <button class="touch-btn" data-key="down">▼</button>
      <button class="touch-btn" data-key="right">▶</button>
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="action-pad">
      <button class="touch-btn" id="touch-interact">覗く/札</button>
      <button class="touch-btn" id="touch-shout">囁く</button>
      <button class="touch-btn" id="touch-jump">跳躍</button>
    </div>
  </div>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-card">
      <h1 class="splash-title">霧の人面森・紙戯</h1>
      <p class="splash-sub">
        深い霧の森と沼を彷徨い、5枚の「切抜札」を集めてください。
      </p>
      <button id="start-btn">霧の森へ入る</button>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // =========================================================================
    // 1. MAGAZINE-CUTOUT ASSET REGISTRY (Inlined as WebP Data URIs on build)

      addGrittyNoise(ctx, w, h, amount, rng) {
        const img = ctx.getImageData(0, 0, w, h);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] === 0) continue;
          const n = (rng() - 0.5) * amount;
          const px = (i / 4) % w;
          const py = Math.floor(i / 4 / w);
          const ht = ((px % 3 === 0 && py % 3 === 0) ? -12 : 4);
          d[i] = Math.max(0, Math.min(255, d[i] + n + ht));
          d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n + ht));
          d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n + ht));
        }
        ctx.putImageData(img, 0, 0);

      makeGroundTexture() {

        const patchCols = ["#2c3326", "#454c3b", "#3d3633", "#4e4946", "#272b24", "#595e4c"];

          ctx.save();

          ctx.fillStyle = patchCols[Math.floor(rng() * patchCols.length)];
          ctx.globalAlpha = 0.45 + rng() * 0.4;
          const pw = 36 + rng() * 90;

          ctx.beginPath();
          ctx.moveTo(-pw / 2, -ph / 2);
          ctx.lineTo(pw / 2 + (rng() - 0.5) * 14, -ph / 2 + (rng() - 0.5) * 10);
          ctx.lineTo(pw / 2, ph / 2 + (rng() - 0.5) * 12);
          ctx.lineTo(-pw / 2 + (rng() - 0.5) * 14, ph / 2);

      startMusicBoxLoop() {
        const pattern = [0, 2, 3, 2, 4, 1, 5, 0];

        this.loopTimer = setInterval(() => {
          if (!this.enabled || !this.started || !this.ctx) return;
          if (Math.random() > 0.22) {

          step++;

      playMusicBox(noteIdx, vol, dur) {
        if (!this.started || !this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const baseFreq = this.notes[noteIdx % this.notes.length];
        // Slight analog tape detune
        const detune = 1 + (Math.random() - 0.5) * 0.012;
        const osc = this.ctx.createOscillator();
        const over = this.ctx.createOscillator();
        const g = this.ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(baseFreq * detune, now);
        over.type = "triangle";
        over.frequency.setValueAtTime(baseFreq * 2.003 * detune, now);

        const gOver = this.ctx.createGain();
        gOver.gain.value = 0.18;

        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(vol || 0.24, now + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0008, now + (dur || 1.4));

        osc.connect(g);
        over.connect(gOver); gOver.connect(g);
        g.connect(this.master);

        osc.start(now); over.start(now);
        osc.stop(now + (dur || 1.4) + 0.05);
        over.stop(now + (dur || 1.4) + 0.05);
      },

      playPaperFlip() {
        if (!this.started || !this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const dur = 0.075;
        const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = "bandpass";
        flt.frequency.value = 1750;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.24, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(flt); flt.connect(g); g.connect(this.master);
        src.start(now);

        const buf = this.ctx.createBuffer(1, Math.floor(this.ctx.sampleRate * dur), this.ctx.sampleRate);
        const d = buf.getChannelData(0);

        g.gain.setValueAtTime(0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        src.connect(flt); flt.connect(g); g.connect(this.master);
        src.start(now);

      if (k === "w" || e.key === "ArrowUp") keys.up = true;
      if (k === "s" || e.key === "ArrowDown") keys.down = true;
      if (k === "a" || e.key === "ArrowLeft") keys.left = true;
      if (k === "d" || e.key === "ArrowRight") keys.right = true;
      if (k === "q") keys.rotL = true;
      if (k === "e") keys.rotR = true;

      if (e.code === "Space") {
        e.preventDefault();
        triggerJump();
      } else if (k === "f" || e.key === "Enter") {
        if (state.dialogue) advanceDialogue(); else triggerInteract();
      } else if (k === "r") {
        spawnWhisper(playerGroup.position);
      } else if (k === "v") {
        toggleCameraMode();
      } else if (k === "m") {
        toggleSound();
      } else if (e.key === "Escape" && state.dialogue) {
        closeDialogue();

      if (k === "w" || e.key === "ArrowUp") keys.up = false;
      if (k === "s" || e.key === "ArrowDown") keys.down = false;
      if (k === "a" || e.key === "ArrowLeft") keys.left = false;
      if (k === "d" || e.key === "ArrowRight") keys.right = false;

      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      state.camYaw -= dx * 0.0065;

    // =========================================================================
    // 9. MINIMAP RENDERER
    // =========================================================================
    const miniCanvas = document.getElementById("minimap");
    const miniCtx = miniCanvas.getContext("2d");

    function drawMinimap() {
      const w = miniCanvas.width, h = miniCanvas.height;
      const cx = w / 2, cy = h / 2;
      const scale = 1.1;

      miniCtx.fillStyle = "#221d1f";
      miniCtx.fillRect(0, 0, w, h);

      // Swamp zone tint
      miniCtx.fillStyle = "rgba(75, 92, 72, 0.35)";
      miniCtx.beginPath();
      miniCtx.arc(cx + 28 * scale, cy - 12 * scale, 18, 0, Math.PI * 2);
      miniCtx.fill();

      // Path line
      miniCtx.strokeStyle = "rgba(222, 214, 199, 0.25)";
      miniCtx.lineWidth = 5;
      miniCtx.beginPath();
      miniCtx.moveTo(cx, cy - 34 * scale);
      miniCtx.lineTo(cx, cy + 28 * scale);
      miniCtx.stroke();

      // Entities (Pale rose squares)
      interactiveEntities.forEach((e) => {
        miniCtx.fillStyle = "#c98b90";
        miniCtx.fillRect(cx + e.def.x * scale - 2.5, cy + e.def.z * scale - 2.5, 5, 5);
      });

      // Uncollected clippings (Amber)
      talismanMeshes.forEach((t) => {
        if (t.def.collected) return;
        miniCtx.fillStyle = "#d99543";
        miniCtx.beginPath();
        miniCtx.arc(cx + t.def.x * scale, cy + t.def.z * scale, 3, 0, Math.PI * 2);
        miniCtx.fill();
      });

      // Player
      const px = cx + playerGroup.position.x * scale;
      const py = cy + playerGroup.position.z * scale;
      miniCtx.save();
      miniCtx.translate(px, py);
      miniCtx.rotate(-state.camYaw);
      miniCtx.fillStyle = "#ebe3d5";
      miniCtx.strokeStyle = "#8f2228";
      miniCtx.lineWidth = 1.5;
      miniCtx.beginPath();
      miniCtx.moveTo(0, -6);
      miniCtx.lineTo(4.5, 5);
      miniCtx.lineTo(-4.5, 5);
      miniCtx.closePath();
      miniCtx.fill();
      miniCtx.stroke();
      miniCtx.restore();
    }

    // =========================================================================
    // 10. MAIN SIMULATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();
    const interactPromptEl = document.getElementById("interact-prompt");

    let grainTick = 0;

    function updatePlayer(dt) {
      if (keys.rotL) state.camYaw += 2.0 * dt;
      if (keys.rotR) state.camYaw -= 2.0 * dt;

      let moveX = 0, moveZ = 0;
      if (!state.dialogue && state.started) {
        if (keys.up) moveZ -= 1;
        if (keys.down) moveZ += 1;
        if (keys.left) moveX -= 1;
        if (keys.right) moveX += 1;
      }

      const moving = moveX !== 0 || moveZ !== 0;
      if (moving) {
        const len = Math.hypot(moveX, moveZ);
        moveX /= len; moveZ /= len;

        // PaRappa 180-deg paper-flip trigger
        if (moveX < -0.2 && state.facingSign !== -1) {
          state.facingSign = -1;
          Sound.playPaperFlip();
        } else if (moveX > 0.2 && state.facingSign !== 1) {
          state.facingSign = 1;
          Sound.playPaperFlip();
        }

        const speed = 10.5;
        const sin = Math.sin(state.camYaw);
        const cos = Math.cos(state.camYaw);
        const wx = moveX * cos + moveZ * sin;
        const wz = -moveX * sin + moveZ * cos;

        const nextX = Math.max(-48, Math.min(48, playerGroup.position.x + wx * speed * dt));
        const nextZ = Math.max(-44, Math.min(34, playerGroup.position.z + wz * speed * dt));

        let blocked = false;
        for (let i = 0; i < colliders.length; i++) {
          const c = colliders[i];
          if (Math.hypot(nextX - c.x, nextZ - c.z) < c.r + 0.7) {
            blocked = true;
            break;
          }
        }
        if (!blocked) {
          playerGroup.position.x = nextX;
          playerGroup.position.z = nextZ;
        }
        state.walkPhase += dt * 12;
      } else {
        state.walkPhase = 0;
      }

      if (!state.onGround) {
        const grav = state.vy < 0 ? 12.5 : 21.0;
        state.vy -= grav * dt;
        state.y += state.vy * dt;
        if (state.y <= 0) {
          state.y = 0; state.vy = 0; state.onGround = true;
        }
      }

      const targetFlip = state.facingSign === 1 ? 0 : Math.PI;
      state.flipAngle += (targetFlip - state.flipAngle) * Math.min(1, dt * 16);

      // Quantized stop-motion puppet articulation (awkward ~7.5fps paper-brad joint snapping!)
      const wScale = state.wobbleScale;
      const stepFrame = Math.floor(state.walkPhase * 1.15);
      if (moving && state.onGround && stepFrame !== state.lastStepFrame) {
        state.lastStepFrame = stepFrame;
        if (stepFrame % 2 === 0) Sound.playJointTick();
      }
      const qPhase = moving ? (stepFrame / 1.15) : 0;

      // Occasional awkward idle twitch of head & arms
      if (!moving && state.onGround) {
        state.idleTwitchTimer -= dt;
        if (state.idleTwitchTimer <= 0) {
          state.idleTwitchTimer = 1.1 + Math.random() * 1.6;
          state.idleHeadTarget = (Math.random() - 0.5) * 0.34 * wScale;
          state.idleArmTarget = (Math.random() - 0.5) * 0.22 * wScale;
        }
      } else {
        state.idleHeadTarget = 0;
        state.idleArmTarget = 0;
      }
      if (state.joltTimer > 0) state.joltTimer = Math.max(0, state.joltTimer - dt);
      const jolt = state.joltTimer > 0 ? Math.sin(state.joltTimer * 35) * 0.32 : 0;

      // Compute target joint angles (stiff, asymmetric Basquiat/Choe collage marionette!)
      let legLRot = 0, legRRot = 0, kneeLRot = 0, kneeRRot = 0;
      let armLRot = 0, armRRot = 0, torsoRot = 0, headRot = 0, oarRot = 0;
      let hop = 0;

      if (!state.onGround) {
        const airStep = Math.floor(clock.elapsedTime * 8) % 2 === 0 ? 1 : -1;
        legLRot = 0.42 * wScale + airStep * 0.08;
        legRRot = -0.45 * wScale - airStep * 0.08;
        kneeLRot = -0.52 * wScale;
        kneeRRot = 0.48 * wScale;
        armLRot = -0.78 * wScale;
        armRRot = 0.82 * wScale;
        torsoRot = airStep * 0.12 * wScale;
        headRot = -airStep * 0.24 * wScale;
        oarRot = 0.38 * airStep * wScale;
      } else if (moving) {
        const s = Math.sin(qPhase);
        const c = Math.cos(qPhase);
        hop = (Math.abs(s) > 0.45 ? 0.28 : 0.05) * wScale;
        legLRot = (s * 0.48 + 0.05) * wScale;
        legRRot = (-s * 0.45 - 0.04) * wScale;
        // Hinged knees bend & kick awkwardly with slight lag!
        kneeLRot = (Math.max(0, c) * -0.62 + 0.08) * wScale;
        kneeRRot = (Math.max(0, -c) * 0.58 - 0.06) * wScale;
        armLRot = (-s * 0.52 - 0.16) * wScale;
        armRRot = (s * 0.48 + 0.14) * wScale;
        torsoRot = (c * 0.13 + 0.03) * wScale;
        headRot = (-c * 0.28 + Math.sin(qPhase * 0.5) * 0.16) * wScale;
        oarRot = (-s * 0.36 + c * 0.24) * wScale;
      } else {
        headRot = state.idleHeadTarget;
        armLRot = -0.08 + state.idleArmTarget;
        armRRot = 0.08 - state.idleArmTarget * 0.7;
        kneeLRot = 0.04;
        kneeRRot = -0.04;
        oarRot = -state.idleArmTarget * 0.9;
      }

      const snap = Math.min(1, dt * 26);
      legLPivot.rotation.z += (legLRot - legLPivot.rotation.z) * snap;
      legRPivot.rotation.z += (legRRot - legRPivot.rotation.z) * snap;
      kneeLPivot.rotation.z += (kneeLRot - kneeLPivot.rotation.z) * snap;
      kneeRPivot.rotation.z += (kneeRRot - kneeRPivot.rotation.z) * snap;
      torsoPivot.rotation.z += (torsoRot + jolt * 0.4 - torsoPivot.rotation.z) * snap;
      headPivot.rotation.z += (headRot + jolt - headPivot.rotation.z) * snap;
      armLPivot.rotation.z += (armLRot - jolt * 0.9 - armLPivot.rotation.z) * snap;
      armRPivot.rotation.z += (armRRot + jolt * 0.9 - armRPivot.rotation.z) * snap;
      oarPivot.rotation.z += (oarRot - oarPivot.rotation.z) * Math.min(1, dt * 16);

      playerPuppet.position.y = state.y + hop;
      playerPuppet.rotation.y = state.camYaw + state.flipAngle;

      const sScale = Math.max(0.45, 1 - state.y * 0.1);
      playerShadow.scale.set(sScale, sScale, 1);

      if (state.firstPerson) {
        camera.position.set(playerGroup.position.x, 2.55 + state.y + hop * 0.4, playerGroup.position.z);
        const lookX = camera.position.x - Math.sin(state.camYaw) * 10;
        const lookZ = camera.position.z - Math.cos(state.camYaw) * 10;
        camera.lookAt(lookX, camera.position.y - (state.camPitch - 0.2) * 8, lookZ);
      } else {
        const camX = playerGroup.position.x + Math.sin(state.camYaw) * state.camDist * Math.cos(state.camPitch);
        const camY = 2.6 + state.y * 0.5 + Math.sin(state.camPitch) * state.camDist;
        const camZ = playerGroup.position.z + Math.cos(state.camYaw) * state.camDist * Math.cos(state.camPitch);
        camera.position.lerp(new THREE.Vector3(camX, camY, camZ), Math.min(1, dt * 8.5));
        camera.lookAt(playerGroup.position.x, 2.4 + state.y * 0.6, playerGroup.position.z);
      }
    }

    function updateWorld(dt, t) {
      // Flicker warm antique lantern light
      lanternLight.intensity = 2.4 + Math.sin(t * 7.5) * 0.35 + Math.sin(t * 19) * 0.15;

      // Sway stalks, ferns, hanging shrouds
      for (let i = 0; i < swayItems.length; i++) {
        const sp = swayItems[i];
        sp.mesh.rotation.z = sp.baseRotZ + Math.sin(t * sp.speed + i) * sp.amp * state.wobbleScale;
      }

      // Interactive entities subtle eerie breathing & proximity check
      let closest = null;
      let closestDist = 6.2;

      interactiveEntities.forEach((ent) => {
        ent.mesh.position.y = ent.baseY + Math.sin(t * 1.4 + ent.phase) * 0.12 * state.wobbleScale;
        ent.mesh.rotation.z = Math.sin(t * 1.1 + ent.phase) * 0.025 * state.wobbleScale;
        const d = Math.hypot(playerGroup.position.x - ent.def.x, playerGroup.position.z - ent.def.z);
        if (d < closestDist) {
          closestDist = d;
          closest = { type: "entity", entity: ent, label: `${ent.def.name} を覗き込む` };
        }
      });

      if (state.paperMode === "billboard") {
        billboardItems.forEach((b) => {
          b.mesh.rotation.y = Math.atan2(camera.position.x - b.mesh.position.x, camera.position.z - b.mesh.position.z);
        });
      }

      // Clippings spin & proximity
      talismanMeshes.forEach((tm, idx) => {
        if (tm.def.collected) return;
        tm.mesh.rotation.y = t * 1.5 + idx;
        tm.mesh.position.y = Math.sin(t * 2.5 + idx) * 0.22;
        const s = 1 + Math.sin(t * 3.5 + idx) * 0.1;
        tm.ring.scale.set(s, s, 1);

        const d = Math.hypot(playerGroup.position.x - tm.def.x, playerGroup.position.z - tm.def.z);
        if (d < 3.8 && d < closestDist) {
          closestDist = d;
          closest = { type: "talisman", entity: tm, label: `${tm.def.name} を拾う` };
        }
      });

      state.nearestInteract = closest;
      if (closest && !state.dialogue && state.started) {
        interactLabelEl.textContent = closest.label;
        interactPromptEl.classList.add("visible");
      } else {
        interactPromptEl.classList.remove("visible");
      }

      // District tracking
      let bestD = Infinity, found = state.currentDistrict;
      for (let i = 0; i < DISTRICTS.length; i++) {
        const d = DISTRICTS[i];
        const dist = Math.hypot(playerGroup.position.x - d.x, playerGroup.position.z - d.z);
        if (dist < bestD) { bestD = dist; found = d; }
      }
      if (found.id !== state.currentDistrict.id) {
        state.currentDistrict = found;
        document.getElementById("zone-name").textContent = found.name;
        document.getElementById("zone-sub").textContent = found.sub;
        showZoneToast(found.name);
      }

      // Magazine Whisper popups
      for (let i = activePopups.length - 1; i >= 0; i--) {
        const p = activePopups[i];
        p.life -= dt * 0.85;
        p.mesh.position.y += dt * 1.3;
        p.mesh.rotation.y = state.camYaw;
        const sc = 0.7 + (1 - Math.abs(p.life - 0.5) * 2) * 0.45;
        p.mesh.scale.set(sc, sc, 1);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          activePopups.splice(i, 1);
        }
      }

      // Mist spore particles
      if (state.rainEnabled) {
        const pos = pGeom.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          pos[i * 3 + 1] -= pSpeeds[i] * dt * 0.55;
          pos[i * 3] += Math.sin(t * 0.7 + i) * 0.35 * dt;
          if (pos[i * 3 + 1] < 0) pos[i * 3 + 1] = 18 + Math.random() * 4;
        }
        pGeom.attributes.position.needsUpdate = true;
      }

      // Animate 12fps vintage film grain
      grainTick += dt;
      if (grainTick > 0.09) {
        grainTick = 0;
        updateFilmGrain();
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, clock.getDelta());
      const t = clock.elapsedTime;
      updatePlayer(dt);
      updateWorld(dt, t);
      drawMinimap();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = () => {
      animate();
    };
  })();
  </script>
</body>
